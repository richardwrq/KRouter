apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

kapt {
    arguments {
        arg("moduleName", project.getName())
    }
}

def krouterAssetsDir = file("$buildDir/generated/krouter/assets")
def generateKRouterMarker = tasks.register("generateKRouterMarker") {
    outputs.dir(krouterAssetsDir)
    doLast {
        krouterAssetsDir.mkdirs()
        new File(krouterAssetsDir, "KRouter_${project.name}").createNewFile()
    }
}

android {
    compileSdkVersion versions.compileSdk

    defaultConfig {
        minSdkVersion versions.minSdk
        targetSdkVersion versions.compileSdk
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDir(krouterAssetsDir)
        }
    }

}

tasks.matching { it.name == "preBuild" }.all {
    dependsOn(generateKRouterMarker)
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation deps.support.appcompat.v7
    testImplementation deps.junit
    androidTestImplementation deps.support.test.runner
    androidTestImplementation deps.support.test.espresso.core

    implementation deps.kotlin.stdLibJre8
    implementation project(':common')
    implementation project(':krouter-api')
    implementation project(':krouter-annotation')
    kapt project(':krouter-compiler')
}
