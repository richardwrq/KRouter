plugins {
    id 'base'
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.3.21' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.3.21' apply false
    id 'org.jetbrains.kotlin.kapt' version '2.4.10' apply false
}

group = 'com.github.richardwrq'
version = '0.2.0-beta.1'

configurations {
    robolectricRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    robolectricRuntime 'org.robolectric:android-all-instrumented:15-robolectric-12650502-i7'
}

def robolectricRuntimeDirectory = layout.buildDirectory.dir('robolectric-runtime')

tasks.register('prepareRobolectricRuntime', Sync) {
    group = 'verification'
    description = 'Stages the dependency-verified Android runtime used by Robolectric tests.'
    from configurations.robolectricRuntime
    into robolectricRuntimeDirectory
}

ext.versions = [
        minSdk    : 21,
        compileSdk: 35,
        targetSdk : 35
]

ext.deps = [
        support   : [
                appcompat : [
                        v7: 'androidx.appcompat:appcompat:1.7.1'
                ],
                constraint: 'androidx.constraintlayout:constraintlayout:2.2.2',
                fragment  : 'androidx.fragment:fragment:1.8.9'
        ],
        auto      : [
                serviceAnnotations: 'com.google.auto.service:auto-service-annotations:1.1.1',
                serviceProcessor  : 'com.google.auto.service:auto-service:1.1.1'
        ],
        kotlinpoet: 'com.squareup:kotlinpoet:1.18.1',
        junit     : 'junit:junit:4.13.2',
        gson      : 'com.google.code.gson:gson:2.13.2'
]

subprojects {
    group = rootProject.group
    version = rootProject.version

    tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        from(rootProject.layout.projectDirectory.file('LICENSE')) {
            into 'META-INF'
            rename { 'LICENSE' }
        }
    }

    plugins.withId('maven-publish') {
        publishing {
            publications.withType(MavenPublication).configureEach {
                pom {
                    licenses {
                        license {
                            name = 'Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }
                }
            }
            repositories {
                maven {
                    name = 'buildRepository'
                    url = rootProject.layout.buildDirectory.dir('repository')
                }
            }
        }
    }
}

def krouterPluginBuild = gradle.includedBuild('krouter-gradle-plugin')

tasks.register('pluginTest') {
    group = 'verification'
    description = 'Runs the standalone KRouter Gradle plugin tests.'
    dependsOn krouterPluginBuild.task(':test')
}

tasks.register('pluginCheck') {
    group = 'verification'
    description = 'Runs all verification for the standalone KRouter Gradle plugin.'
    dependsOn krouterPluginBuild.task(':check')
}

tasks.register('pluginClean') {
    group = 'build'
    description = 'Cleans outputs from the standalone KRouter Gradle plugin build.'
    dependsOn krouterPluginBuild.task(':clean')
}

tasks.register('publishLibrariesToBuildRepository') {
    group = 'publishing'
    description = 'Publishes KRouter libraries to build/repository without credentials.'
    dependsOn ':krouter-annotation:publish', ':krouter-compiler:publish', ':krouter-api:publish'
}

tasks.register('publishPluginToBuildRepository') {
    group = 'publishing'
    description = 'Publishes the standalone KRouter Gradle plugin to build/repository.'
    dependsOn krouterPluginBuild.task(':publish')
}

tasks.register('verifyPublicationLicenses') {
    group = 'verification'
    description = 'Verifies that every published archive and POM carries the Apache-2.0 license.'
    dependsOn tasks.named('publishLibrariesToBuildRepository')
    dependsOn tasks.named('publishPluginToBuildRepository')

    doLast {
        def repository = layout.buildDirectory.dir('repository').get().asFile
        def publishedVersion = project.version.toString()
        def licenseBytes = layout.projectDirectory.file('LICENSE').asFile.bytes
        def archives = fileTree(repository).matching {
            include "**/${publishedVersion}/*.aar"
            include "**/${publishedVersion}/*.jar"
        }.files.sort { first, second -> first.path <=> second.path }
        if (archives.size() != 8) {
            throw new GradleException(
                    "Expected 8 published AAR/JAR archives for ${publishedVersion}, found ${archives.size()}")
        }
        archives.each { archive ->
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                def entries = java.util.Collections.list(zip.entries()).findAll {
                    it.name == 'META-INF/LICENSE'
                }
                if (entries.size() != 1) {
                    throw new GradleException(
                            "${archive.name} must contain exactly one META-INF/LICENSE entry")
                }
                def packagedLicense = zip.getInputStream(entries[0]).withCloseable {
                    it.bytes
                }
                if (!java.util.Arrays.equals(licenseBytes, packagedLicense)) {
                    throw new GradleException(
                            "${archive.name} contains a LICENSE that differs from the repository LICENSE")
                }
            }
        }

        def poms = fileTree(repository).matching {
            include "**/${publishedVersion}/*.pom"
        }.files.sort { first, second -> first.path <=> second.path }
        if (poms.size() != 5) {
            throw new GradleException(
                    "Expected 5 published POMs for ${publishedVersion}, found ${poms.size()}")
        }
        poms.each { pom ->
            def contents = pom.getText('UTF-8')
            ['<name>Apache License, Version 2.0</name>',
             '<url>https://www.apache.org/licenses/LICENSE-2.0.txt</url>',
             '<distribution>repo</distribution>'].each { requiredText ->
                if (!contents.contains(requiredText)) {
                    throw new GradleException(
                            "${pom.name} is missing Maven license metadata: ${requiredText}")
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('pluginCheck')
    dependsOn subprojects.collect { "${it.path}:check" }
}
