plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'com.github.richardwrq'
version = '0.2.0-beta.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(layout.projectDirectory.file('../LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE' }
    }
}

dependencies {
    implementation localGroovy()

    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'
}

def rootVerificationMetadata = layout.projectDirectory.file('../gradle/verification-metadata.xml')

tasks.withType(Test).configureEach {
    inputs.file(rootVerificationMetadata)
    systemProperty(
            'krouterVerificationMetadata',
            rootVerificationMetadata.asFile.absolutePath
    )
}

gradlePlugin {
    plugins {
        krouter {
            id = 'com.github.richardwrq.krouter'
            implementationClass = 'com.github.richardwrq.krouter.gradle.plugin.KRouterPlugin'
            displayName = 'KRouter Android plugin'
            description = 'Configures KRouter annotation processing and generated module marker assets.'
        }
    }
}

publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            licenses {
                license {
                    name = 'Apache License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    distribution = 'repo'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'buildRepository'
            url = layout.projectDirectory.dir('../build/repository')
        }
    }
}
