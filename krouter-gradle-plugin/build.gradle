plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'com.github.richardwrq'
version = '0.2.0-beta.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

dependencies {
    implementation localGroovy()

    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'
}

gradlePlugin {
    plugins {
        krouter {
            id = 'com.github.richardwrq.krouter'
            implementationClass = 'com.github.richardwrq.krouter.gradle.plugin.KRouterPlugin'
            displayName = 'KRouter Android plugin'
            description = 'Configures KRouter annotation processing and generated module marker assets.'
        }
    }
}

publishing {
    repositories {
        maven {
            name = 'buildRepository'
            url = layout.projectDirectory.dir('../build/repository')
        }
    }
}
