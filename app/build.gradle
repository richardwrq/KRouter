plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

kapt {
    arguments {
        arg('moduleName', project.name)
    }
}

def krouterAssetsDir = layout.buildDirectory.dir('generated/krouter/assets')
def generateKRouterMarker = tasks.register('generateKRouterMarker') {
    outputs.dir(krouterAssetsDir)
    doLast {
        def outputDir = krouterAssetsDir.get().asFile
        outputDir.mkdirs()
        new File(outputDir, "KRouter_${project.name}").createNewFile()
    }
}

android {
    namespace = 'com.github.richardwrq.krouter'
    compileSdk = versions.compileSdk

    defaultConfig {
        applicationId = 'com.github.richardwrq.krouter'
        minSdk = versions.minSdk
        targetSdk = versions.targetSdk
        versionCode = 1
        versionName = '1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.assets.srcDir(krouterAssetsDir)
        debug.assets.srcDirs = ['src/debug/assets']
        release.assets.srcDirs = ['src/release/assets']
    }
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
    }
}

tasks.named('preBuild') {
    dependsOn(generateKRouterMarker)
}

dependencies {
    implementation deps.support.appcompat.v7
    implementation deps.support.constraint
    implementation deps.gson
    implementation project(':module-java')
    implementation project(':common')
    implementation project(':krouter-api')
    implementation project(':krouter-annotation')
    kapt project(':krouter-compiler')

    testImplementation deps.junit
    androidTestImplementation deps.support.test.runner
    androidTestImplementation deps.support.test.junitExt
    androidTestImplementation deps.support.test.espresso.core
}
