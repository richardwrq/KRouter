plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'com.github.richardwrq.krouter.api'
    compileSdk = versions.compileSdk

    defaultConfig {
        minSdk = versions.minSdk
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
    }
}

dependencies {
    implementation project(':krouter-annotation')
    api deps.support.fragment

    testImplementation deps.junit
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation deps.support.test.runner
    androidTestImplementation deps.support.test.junitExt
    androidTestImplementation deps.support.test.espresso.core
}

tasks.withType(Test).configureEach {
    providers.gradleProperty('krouterRobolectricRepository').orNull?.with { repositoryUrl ->
        systemProperty 'robolectric.dependency.repo.url', repositoryUrl
    }
}
