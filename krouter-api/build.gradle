plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'com.github.richardwrq.krouter.api'
    compileSdk = versions.compileSdk

    defaultConfig {
        minSdk = versions.minSdk
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
    }
}

dependencies {
    api project(':krouter-annotation')
    api deps.support.fragment

    testImplementation deps.junit
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

tasks.withType(Test).configureEach {
    dependsOn rootProject.tasks.named('prepareRobolectricRuntime')
    systemProperty 'robolectric.offline', 'true'
    systemProperty(
            'robolectric.dependency.dir',
            rootProject.layout.buildDirectory.dir('robolectric-runtime').get().asFile.absolutePath)
}

publishing {
    publications {
        release(MavenPublication) {
            artifactId = 'krouter-api'
            afterEvaluate {
                from components.release
            }
        }
    }
}
