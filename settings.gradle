pluginManagement {
    includeBuild('krouter-gradle-plugin')

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id in [
                    'org.jetbrains.kotlin.android',
                    'org.jetbrains.kotlin.jvm',
                    'org.jetbrains.kotlin.kapt'
            ] && requested.version != null) {
                useModule("org.jetbrains.kotlin:kotlin-gradle-plugin:${requested.version}")
            }
        }
    }

    repositories {
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'KRouter'

include ':app', ':krouter-annotation', ':krouter-api', ':krouter-compiler', ':module-java', ':common', ':compiler-integration-test'
