plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.kapt'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(8)
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
    }
}

kapt {
    includeCompileClasspath = false
}

dependencies {
    compileOnly deps.auto.serviceAnnotations
    kapt deps.auto.serviceProcessor
    implementation deps.kotlinpoet
    api project(':krouter-annotation')

    testImplementation deps.junit
}

components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) {
    skip()
}
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) {
    skip()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'krouter-compiler'
            from components.java
        }
    }
}
